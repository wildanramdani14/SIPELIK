<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIPELIK UIN Siber Syekh Nurjati Cirebon</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('sipelik_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <!-- Import Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 440px;
        }

        .form-icon-wrapper {
            position: relative;
        }

        .form-icon-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.25rem;
        }

        .form-icon-wrapper input {
            padding-left: 3rem;
        }

        .quick-login-section {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }

        .quick-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.65rem;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: white;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            margin: 0.2rem;
        }

        .quick-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(11, 92, 58, 0.05);
            transform: translateY(-1px);
        }

        .quick-chip.chip-gold:hover {
            border-color: var(--accent-light);
            color: var(--accent-dark);
            background: rgba(193, 147, 59, 0.1);
        }

        .toast-notify {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast-notify.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-notify.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        .toast-notify.success {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #6EE7B7;
        }

        @media (max-width: 576px) {
            .toast-notify {
                top: 1rem;
                left: 50%;
                right: auto;
                transform: translate(-50%, -10px);
                width: 90%;
                max-width: 360px;
                justify-content: center;
                text-align: center;
            }
            .toast-notify.show {
                transform: translate(-50%, 0);
            }
            .auth-card {
                padding: 1.5rem 1.15rem;
                margin: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Dark Mode Toggle Button -->
    <button type="button" id="themeToggleBtn" class="theme-toggle-floating" onclick="toggleTheme()" title="Ubah Mode Gelap / Terang" aria-label="Ubah Mode Gelap / Terang">
        <i class="ph-bold ph-moon" id="themeIcon"></i>
    </button>

    <div id="toastNotify" class="toast-notify"></div>

    <div class="auth-wrapper">
        <div class="auth-card fade-in-up">
            <div class="auth-header">
                <img src="assets/logo.png" alt="Logo SIPELIK UIN SSC" class="auth-logo-img">
                <h1 style="font-size: 1.8rem; margin-bottom: 0.25rem;">SIPELIK</h1>
                <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.4;">
                    Sistem Pengaduan Lingkungan Kampus<br>
                    <strong>UIN Siber Syekh Nurjati Cirebon</strong>
                </p>
            </div>

            <!-- Form Login (Hanya Username & Password) -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label">Username / ID</label>
                    <div class="form-icon-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="inputUsername" class="form-control" placeholder="Masukkan username Anda" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="form-icon-wrapper">
                        <i class="ph ph-lock"></i>
                        <input type="password" id="inputPassword" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
                    </div>
                </div>

                <div style="display: flex; align-items: center; margin-bottom: 1.5rem; font-size: 0.88rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none;">
                        <input type="checkbox" checked style="accent-color: var(--primary);"> Ingat saya
                    </label>
                </div>

                <button type="submit" id="btnSubmitLogin" class="btn btn-primary" style="width: 100%; font-size: 1.05rem; padding: 0.75rem;">
                    <span>Masuk ke Sistem</span> <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>

            <!-- Quick Demo Login (Mengisi otomatis Username & Password) -->
            <div class="quick-login-section">
                <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.35rem;">
                    <i class="ph-bold ph-lightning" style="color: var(--accent-light);"></i> Akun Uji Coba Cepat:
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
                    <button type="button" class="quick-chip chip-gold" onclick="quickFill('superadmin', '123')">
                        👑 Super Admin
                    </button>
                    <button type="button" class="quick-chip" onclick="quickFill('admin', '123')">
                        🛡️ Admin Layanan
                    </button>
                    <button type="button" class="quick-chip" onclick="quickFill('mahasiswa', '123')">
                        🎓 Mahasiswa (Pelapor)
                    </button>
                </div>
                <div style="font-size: 0.76rem; color: var(--text-muted); margin-top: 0.5rem; display: flex; align-items: center; gap: 0.3rem;">
                    <i class="ph-bold ph-whatsapp-logo" style="color: #25D366;"></i>
                    <span>Petugas Lapangan dikoordinasikan langsung via WhatsApp oleh Admin.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.API_BASE || (
            (window.location.protocol === 'file:' || (window.location.port && window.location.port !== '3000'))
            ? 'http://localhost:3000/api'
            : '/api'
        );

        function notify(msg, type = 'success') {
            const el = document.getElementById('toastNotify');
            el.className = `toast-notify ${type} show`;
            el.innerHTML = `<i class="ph-bold ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'}"></i> <span>${msg}</span>`;
            setTimeout(() => { el.classList.remove('show'); }, 3000);
        }

        // Fungsi uji coba cepat: isi username & password langsung submit
        function quickFill(user, pass) {
            document.getElementById('inputUsername').value = user;
            document.getElementById('inputPassword').value = pass;
            notify(`Mengisi kredensial ${user}...`, 'success');
            setTimeout(() => {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }, 300);
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('inputUsername').value.trim();
            const password = document.getElementById('inputPassword').value.trim();
            const btn = document.getElementById('btnSubmitLogin');

            if (!username || !password) {
                notify('Harap masukkan username dan password!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="ph-bold ph-spinner ph-spin"></i> Memverifikasi...';

            try {
                // Login hanya mengirim username dan password
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    notify(data.error || 'Username atau password salah!', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Masuk ke Sistem</span> <i class="ph-bold ph-arrow-right"></i>';
                    return;
                }

                // Simpan session pengguna
                localStorage.setItem('sipelik_user', JSON.stringify(data.user));

                // Tentukan halaman tujuan otomatis berdasarkan peran dari database
                const role = data.user.role;
                let roleLabel = 'Mahasiswa';
                let redirectUrl = 'index.html';

                if (role === 'superadmin') {
                    roleLabel = 'Super Administrator';
                    redirectUrl = 'superadmin.html';
                } else if (role === 'admin') {
                    roleLabel = 'Admin Layanan';
                    redirectUrl = 'admin.html';
                } else if (role === 'petugas') {
                    notify('Petugas lapangan tidak menggunakan akun login web. Koordinasi tugas dikoordinasikan langsung via WhatsApp oleh Admin.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Masuk ke Sistem</span> <i class="ph-bold ph-arrow-right"></i>';
                    return;
                }

                notify(`Login berhasil sebagai ${roleLabel} (${data.user.name})! Mengalihkan...`, 'success');

                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 600);

            } catch (err) {
                console.warn('Gagal koneksi ke server, memeriksa autentikasi darurat/offline...', err);
                const defaultUsers = [
                    { id: 1, name: 'Dr. H. Ahmad Fauzi, M.T.', username: 'superadmin', role: 'superadmin', phone: '081234567890' },
                    { id: 2, name: 'Rina Kusuma, S.Kom', username: 'admin', role: 'admin', phone: '081298765432' },
                    { id: 3, name: 'Bayu Pratama, S.T', username: 'admin2', role: 'admin', phone: '081255554444' },
                    { id: 7, name: 'Ahmad Mahasiswa', username: 'mahasiswa', role: 'user', phone: '085712345678' }
                ];
                const cleanUser = username.toLowerCase();
                const matched = defaultUsers.find(u => (u.username.toLowerCase() === cleanUser || u.phone === cleanUser) && password === '123');
                if (matched) {
                    localStorage.setItem('sipelik_user', JSON.stringify(matched));
                    notify(`Login berhasil (${matched.name})! Mengalihkan...`, 'success');
                    const redirectUrl = matched.role === 'superadmin' ? 'superadmin.html' : (matched.role === 'admin' ? 'admin.html' : 'index.html');
                    setTimeout(() => { window.location.href = redirectUrl; }, 600);
                    return;
                }
                notify('Username atau password salah! Pastikan kredensial benar.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<span>Masuk ke Sistem</span> <i class="ph-bold ph-arrow-right"></i>';
            }
        }

        // Theme management (Dark Mode)
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            localStorage.setItem('sipelik_theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                if (theme === 'dark') {
                    icon.className = 'ph-fill ph-sun';
                    icon.style.color = '#FBBF24';
                } else {
                    icon.className = 'ph-bold ph-moon';
                    icon.style.color = '';
                }
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            applyTheme(isDark ? 'light' : 'dark');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            updateThemeIcon(currentTheme);
        });
    </script>
</body>
</html>
