[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  included_files = ["database.json", "database.db", "js/**"]

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
